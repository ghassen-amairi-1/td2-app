apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: td2-ingress
  namespace: td2
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
